<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Wolly Mouse</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Arial', sans-serif;
  background-color: #f5f0e6;
  color: #4a4a4a;
}

/* Warenkorb */
.cart {
  position: fixed;
  top: 20px;
  right: 20px;
  background: white;
  padding: 10px 18px;
  border-radius: 25px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  font-size: 16px;
  z-index: 1000;
}

/* HERO MIT HINTERGRUNDBILD */
.hero {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  position: relative;
  background: linear-gradient(135deg, #f2c6cf, #dfe8df);
  overflow: hidden;
}

/* Transparenz-Bild */
.hero::before {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background: url("images/Titelbild.jpeg") center/cover no-repeat;
  opacity: 0.25; /* Transparenz hier anpassen */
  z-index: 0;
}

.hero h1 {
  font-family: 'Pacifico', cursive;
  font-size: 4em;
  position: relative;
  z-index: 1;
}

/* Produkte */
.products {
  padding: 60px 20px;
}

.products h2 {
  text-align: center;
  margin-bottom: 40px;
  font-family: 'Pacifico', cursive;
  font-size: 3em;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 25px;
}

.card {
  text-align: center;
  transition: transform 0.2s;
}

.card:hover {
  transform: translateY(-5px);
}

.card img {
  width: 100%;
  height: 250px;
  object-fit: cover;
  border-radius: 15px;
  cursor: pointer;
}

.card h3 {
  margin: 10px 0 5px;
  font-family: 'Pacifico', cursive;
}

.price {
  color: #8b7a6b;
}

button {
  background: #e8b7c1;
  border: none;
  padding: 8px 15px;
  border-radius: 20px;
  cursor: pointer;
}

button:hover {
  background: #d99aa8;
}

/* Bestellung */
.order {
  padding: 60px 20px;
  background-color: #ede6d8;
}

form {
  max-width: 500px;
  margin: auto;
  display: flex;
  flex-direction: column;
}

input, textarea {
  margin: 8px 0;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #ccc;
}

#orderList {
  font-family: monospace;
  white-space: pre-wrap;
  background: #fff;
  padding: 10px;
  min-height: 100px;
  margin-bottom: 10px;
  border-radius: 10px;
}

/* Bild Overlay */
#imageOverlay {
  display: none;
  position: fixed;
  z-index: 2000;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0,0,0,0.8);
  justify-content: center;
  align-items: center;
}

#imageOverlay img {
  max-width: 90%;
  max-height: 90%;
  border-radius: 20px;
}

#imageOverlay span {
  position: absolute;
  top: 30px;
  right: 40px;
  font-size: 35px;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="cart">🛒 <span id="cartCount">0</span></div>

<section class="hero">
  <h1>Wolly Mouse</h1>
</section>

<section class="products">
  <h2>Meine Mäuse</h2>
  <div class="grid">

    <div class="card">
      <img src="images/Bade_Maus.jpeg" onclick="openImage(this.src)">
      <h3>Bade Maus</h3>
      <p class="price">20 CHF</p>
      <button onclick="addToCart('Bade Maus', 20)">In den Warenkorb</button>
    </div>

    <div class="card">
      <img src="images/Blumen_Maus.jpeg" onclick="openImage(this.src)">
      <h3>Blumen Maus</h3>
      <p class="price">20 CHF</p>
      <button onclick="addToCart('Blumen Maus', 20)">In den Warenkorb</button>
    </div>

    <div class="card">
      <img src="images/Garten_maus.jpeg" onclick="openImage(this.src)">
      <h3>Garten Maus</h3>
      <p class="price">20 CHF</p>
      <button onclick="addToCart('Garten Maus', 20)">In den Warenkorb</button>
    </div>

    <div class="card">
      <img src="images/Strand_Maus.jpeg" onclick="openImage(this.src)">
      <h3>Strand Maus</h3>
      <p class="price">20 CHF</p>
      <button onclick="addToCart('Strand Maus', 20)">In den Warenkorb</button>
    </div>

    <div class="card">
      <img src="images/WSL_Maus.jpeg" onclick="openImage(this.src)">
      <h3>WSL Maus</h3>
      <p class="price">20 CHF</p>
      <button onclick="addToCart('WSL Maus', 20)">In den Warenkorb</button>
    </div>

    <div class="card">
      <img src="images/Wander_Maus.jpeg" onclick="openImage(this.src)">
      <h3>Wander Maus</h3>
      <p class="price">20 CHF</p>
      <button onclick="addToCart('Wander Maus', 20)">In den Warenkorb</button>
    </div>

  </div>
</section>

<!-- Overlay -->
<div id="imageOverlay">
  <span onclick="closeImage()">×</span>
  <img id="overlayImg">
</div>

<script>
let cart = [];
let total = 0;

function addToCart(name, price){
  cart.push({name, price});
  total += price;
  document.getElementById("cartCount").textContent = cart.length;
}

function openImage(src){
  document.getElementById("overlayImg").src = src;
  document.getElementById("imageOverlay").style.display = "flex";
}

function closeImage(){
  document.getElementById("imageOverlay").style.display = "none";
}
</script>

</body>
</html>
